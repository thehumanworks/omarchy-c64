<!-- Trimmed from https://omarchy.org/teams/ (2026-09-06): two teams, three
     members, one of them with no `member__meta`. -->
<body>
  <div class="pre"><a href="/"><pre>OMARCHY</pre></a></div>
  <header class="header"><h1>The teams guiding Omarchy</h1></header>
  <main class="main">
    <div class="teams">
      <section class="team" id="core">
        <header class="team__header">
          <h2 class="team__name">Omarchy Core</h2>
          <p class="team__description">Setting the direction</p>
        </header>
        <div class="team__members">
          <article class="member">
            <img class="member__avatar" src="/assets/dhh.webp" alt="DHH">
            <h3 class="member__name"><a href="https://dhh.dk">DHH</a></h3>
            <p class="member__meta">USA/Denmark</p>
          </article>
          <article class="member">
            <img class="member__avatar" src="/assets/tobi.webp" alt="Tobi">
            <h3 class="member__name"><a href="https://x.com/tobi">Tobi L&uuml;tke</a></h3>
            <p class="member__meta">Canada</p>
          </article>
        </div>
      </section>
      <section class="team" id="rangers">
        <header class="team__header">
          <h2 class="team__name">Omarchy Rangers</h2>
          <p class="team__description">Helping others find their way</p>
        </header>
        <div class="team__members">
          <article class="member">
            <h3 class="member__name"><a href="https://example.com/mihai">Mihai</a></h3>
          </article>
        </div>
        <p class="team__note">Want to help? <a href="/teams/#rangers">Get in touch</a></p>
      </section>
    </div>
  </main>
</body>
