# Pull requests run once. Dispatch offers full verification for a branch.
# Isolated docs/tooling changes need no Chromium or site preview.
name: CI

on:
  pull_request:
  workflow_dispatch:

# One run per ref. A new push supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# bash -eo pipefail: a failing command behind `| tee` must fail the step.
defaults:
  run:
    shell: bash

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      full: ${{ github.event_name != 'pull_request' }}
      base: ${{ github.event.pull_request.base.sha || '' }}

  preview:
    name: Preview deploy
    needs: verify
    if: github.event_name == 'pull_request' && needs.verify.outputs.built == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install tools from mise.toml
        uses: jdx/mise-action@v2
        with:
          install_args: node
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Download checked page
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      # Cloudflare credentials come from repository secrets here. Locally the
      # same two variables are supplied by 1Password through `fnox run --`.
      - name: Deploy preview to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          npx wrangler pages deploy dist \
            --project-name omarchy-website \
            --branch "$HEAD_REF" | tee deploy.log
          url="$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -n 1)"
          if [ -z "$url" ]; then
            echo "Could not find a preview URL in the wrangler output" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Preview deployed"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the preview URL on the pull request
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- omarchy-preview -->';
            const body = [
              marker,
              '### Preview deployment',
              '',
              `${process.env.PREVIEW_URL}`,
              '',
              `Built from ${context.sha.slice(0, 7)} by [this run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body && c.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
