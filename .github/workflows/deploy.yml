# Production checks affected components only from a verified previous release.
# Missing history, shared inputs and manual runs receive full verification.
name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Never cancel a production deploy in flight; queue instead.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

# bash -eo pipefail: a failing command behind `| tee` must fail the step.
defaults:
  run:
    shell: bash

jobs:
  baseline:
    name: Find verified baseline
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.baseline.outputs.full }}
    steps:
      - uses: actions/checkout@v5
      - name: Require a successful run for the previous commit
        id: baseline
        uses: actions/github-script@v8
        with:
          script: |
            let verified = false;
            try {
              const { pathToFileURL } = require('node:url');
              const module = pathToFileURL(process.env.GITHUB_WORKSPACE + '/scripts/ci/baseline.mjs');
              const { hasVerifiedBaseline } = await import(module.href);
              if (context.eventName === 'push') {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  ...context.repo,
                  workflow_id: 'deploy.yml',
                  head_sha: context.payload.before,
                  status: 'success',
                  per_page: 100,
                });
                verified = hasVerifiedBaseline(data.workflow_runs, context.payload.before);
              }
            } catch (error) {
              core.warning('Previous verification could not be established; running full checks.');
            }
            core.setOutput('full', String(!verified));

  verify:
    needs: baseline
    uses: ./.github/workflows/verify.yml
    with:
      full: ${{ needs.baseline.outputs.full != 'false' }}
      base: ${{ github.event.before || '' }}
      push: true

  deploy:
    name: Deploy verified page
    needs: verify
    if: github.ref == 'refs/heads/main' && needs.verify.outputs.built == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install_args: node
          cache: true
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      # Credentials are repository secrets. Locally the same two variable names
      # are provided by 1Password through `fnox run --`.
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name omarchy-website \
            --branch main | tee deploy.log
          url="$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -n 1)"
          if [ -z "$url" ]; then
            echo "Could not find a deployment URL in the wrangler output" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summarise the deployment
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### Deployed to production"
            echo ""
            echo "- Site: https://omarchy.thehuman.sh"
            echo "- Deployment: $DEPLOY_URL"
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
