# Production deploy: push to main -> verify -> Cloudflare Pages -> omarchy.thehuman.sh
#
# The verify steps are the same ones ci.yml runs on the pull request. They are
# repeated here on purpose: main is what the public sees, so nothing ships
# without a green run of the real suite against the merge commit.
#
# Only the `--branch main` deployment is production. Every other branch name
# (see ci.yml) produces a preview.
name: Deploy

on:
  push:
    branches:
      - main

# Never cancel a production deploy in flight; queue instead.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

# bash -eo pipefail: a failing command behind `| tee` must fail the step.
defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Verify and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install tools from mise.toml
        uses: jdx/mise-action@v2
        with:
          install_args: node
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit and build tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      # Credentials are repository secrets. Locally the same two variable names
      # are provided by 1Password through `fnox run --`.
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name omarchy-website \
            --branch main | tee deploy.log
          url="$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -n 1)"
          if [ -z "$url" ]; then
            echo "Could not find a deployment URL in the wrangler output" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summarise the deployment
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### Deployed to production"
            echo ""
            echo "- Site: https://omarchy.thehuman.sh"
            echo "- Deployment: $DEPLOY_URL"
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
