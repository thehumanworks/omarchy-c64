# Production checks affected components only from a verified previous release.
# Missing history, shared inputs and manual runs receive full verification.
name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Never cancel a production deploy in flight; queue instead.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

# bash -eo pipefail: a failing command behind `| tee` must fail the step.
defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Verify and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require a successful run for the previous commit
        id: baseline
        uses: actions/github-script@v8
        with:
          script: |
            let verified = false;
            try {
              const { pathToFileURL } = require('node:url');
              const module = pathToFileURL(process.env.GITHUB_WORKSPACE + '/scripts/ci/baseline.mjs');
              const { hasVerifiedBaseline } = await import(module.href);
              if (context.eventName === 'push') {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  ...context.repo,
                  workflow_id: 'deploy.yml',
                  head_sha: context.payload.before,
                  status: 'success',
                  per_page: 100,
                });
                verified = hasVerifiedBaseline(data.workflow_runs, context.payload.before);
              }
            } catch (error) {
              core.warning('Previous verification could not be established; running full checks.');
            }
            core.setOutput('full', String(!verified));

      - name: Install tools from mise.toml
        uses: jdx/mise-action@v2
        with:
          install_args: node
          cache: true

      - name: Select affected checks
        id: plan
        env:
          FULL: ${{ steps.baseline.outputs.full }}
          BASE: ${{ github.event.before || '' }}
        run: |
          if [ "$FULL" != false ]; then
            npm run ci:plan -- --full
          else
            npm run ci:plan -- --push-base "$BASE"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        if: steps.plan.outputs.browser == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run selected checks
        env:
          FULL: ${{ steps.baseline.outputs.full }}
          BASE: ${{ github.event.before || '' }}
        run: |
          if [ "$FULL" != false ]; then
            npm run check
          else
            npm run check:changed -- --push-base "$BASE"
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      # Credentials are repository secrets. Locally the same two variable names
      # are provided by 1Password through `fnox run --`.
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.plan.outputs.build == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name omarchy-website \
            --branch main | tee deploy.log
          url="$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -n 1)"
          if [ -z "$url" ]; then
            echo "Could not find a deployment URL in the wrangler output" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summarise the deployment
        if: steps.plan.outputs.build == 'true'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### Deployed to production"
            echo ""
            echo "- Site: https://omarchy.thehuman.sh"
            echo "- Deployment: $DEPLOY_URL"
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
