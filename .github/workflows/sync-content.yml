name: Sync content

# Pull omarchy.org's copy into content/pages/*.json once a week and open a PR
# with the result. It never pushes to main: the diff is editorial, so a human
# reads the summary before it ships. See docs/CONTENT-SOURCES.md.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync content from the sources
        id: sync
        env:
          # Lifts the GitHub API rate limit for the manual's chapter listing.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          npm run sync 2>&1 | tee sync.log && status=0 || status=$?
          {
            echo 'summary<<SYNC_EOF'
            cat sync.log
            echo SYNC_EOF
          } >> "$GITHUB_OUTPUT"
          # A page whose source was down keeps its committed JSON; report the
          # failure but still open a PR for whatever else did change.
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Check whether content changed
        id: changed
        run: |
          if git diff --quiet -- content/; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- content/
          fi

      - name: Verify the site still builds with the new content
        if: steps.changed.outputs.any == 'true'
        run: |
          npm run test
          npm run build

      - name: Open or update the content pull request
        if: steps.changed.outputs.any == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: content-sync
          base: main
          labels: content
          commit-message: 'content: sync from omarchy.org'
          title: 'content: sync from omarchy.org'
          add-paths: content/
          delete-branch: false
          body: |
            Automated weekly content sync. Sources are listed in
            `content/sources.json`; the evidence behind each one is in
            `docs/CONTENT-SOURCES.md`.

            ```
            ${{ steps.sync.outputs.summary }}
            ```

            `npm run test` and `npm run build` passed against this content.
            Review the wording, then merge.

      - name: Fail if any source was unreachable
        if: steps.sync.outputs.status != '0'
        run: |
          echo "::error::One or more sources failed; those pages kept their committed JSON."
          exit 1
